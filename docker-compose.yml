services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local_dev
      MYSQL_DATABASE: forge_gym
      MYSQL_USER: gym_app
      MYSQL_PASSWORD: gym_local_dev
    ports:
      - "3306:3306"
    volumes:
      - gym_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gym_mysql_data: